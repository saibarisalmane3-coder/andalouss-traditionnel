<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Collections · ATD</title><link rel="stylesheet" href="/styles.css"><style>body{background:#211d19;color:#f4eee5;font-family:Manrope,Arial;margin:0}.wrap{max-width:1300px;margin:auto;padding:32px 5% 80px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff22;padding:18px 5%}.logo{color:#edc875;font-weight:800;font-size:28px}.nav a{color:#f4eee5;text-decoration:none;margin-left:22px}.hero{padding:55px 0 35px}.kicker{color:#e9a66c;letter-spacing:.15em;font-size:12px;font-weight:700}.hero h1{font:500 clamp(42px,6vw,78px)/1.05 'Playfair Display',serif;margin:14px 0}.hero p{color:#cfc5b8;max-width:720px;line-height:1.6}.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:25px 0}.tabs button{border:1px solid #75634f;background:transparent;color:#f4eee5;border-radius:999px;padding:11px 16px;cursor:pointer}.tabs button.active{background:#d28a4c;border-color:#d28a4c;color:#211d19}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:#2a241f;border:1px solid #4d443c;border-radius:12px;overflow:hidden}.card img{display:block;width:100%;aspect-ratio:1;object-fit:cover}.card p{padding:12px;margin:0;font-weight:700}.empty{color:#cfc5b8;padding:30px 0}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.top{padding:14px 5%}.nav{display:none}.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><header class="top"><a class="logo" href="/">✦ ATD</a><nav class="nav"><a href="/">Accueil</a><a href="/boutique.html">Boutique</a><a href="/portfolio.html">Réalisations</a><a href="/#devis">Contact</a></nav></header><main class="wrap"><section class="hero"><div class="kicker">CATALOGUE ATD</div><h1 id="title">Nos nouvelles collections</h1><p>Découvrez nos réalisations artisanales : zellige, fontaines, tables, toitures et piscines.</p></section><div id="tabs" class="tabs"></div><section id="grid" class="grid"></section></main><script>const groups=[['الارض','Sols & dallages',18],['بجمات','Bejmat',27],['خصة','Décors en plâtre',24],['ساريات','Colonnes & piliers',32],['سقايات','Fontaines',21],['صالونات','Salons',30],['صفائح','Panneaux & plaques',16],['طاولات','Tables',23],['قرمود','Toitures en tuile',16],['piscine','Piscines',5]];const q=new URLSearchParams(location.search),selected=q.get('g')||'all';tabs.innerHTML='<button data-g="all">Toutes</button>'+groups.map(g=>`<button data-g="${g[0]}">${g[1]}</button>`).join('');function render(g){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.g===g));let list=g==='all'?groups:groups.filter(x=>x[0]===g);grid.innerHTML=list.flatMap(x=>Array.from({length:x[2]},(_,i)=>`<article class="card"><img loading="lazy" src="/images/collections/${x[0]}/img-${String(i+1).padStart(2,'0')}.jpeg" alt="${x[1]}"><p>${x[1]}</p></article>`)).join('')||'<p class="empty">Aucune image.</p>';}document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{history.replaceState(null,'','?g='+encodeURIComponent(b.dataset.g));render(b.dataset.g)}));render(selected);</script></body></html>
